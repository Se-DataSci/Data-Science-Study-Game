<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status 200 Study Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#E3E8EF; --ink:#14213D; --muted:#5A6781;
  --line:#CBD3DF; --accent:#2B59C3; --accent-ink:#FFFFFF; --ok:#1F8A55; --ok-bg:#E1F3E9;
  --bad:#C0392F; --bad-bg:#FBE5E3; --amber:#B7791F; --amber-bg:#FDF1DC; --myst:#7B4FC9; --myst-bg:#EFE7FB;
  --grass:#BFD9A8; --grass2:#A6C98E; --dirt:#E9D3A6; --dirt-hi:#F6E6C4; --dirt-edge:#CDAE78;
  --tree:#4E8F5A; --tree2:#72B27A; --pine:#3F7A4F; --trunk:#7A5433; --rock:#A3AAB4; --rock2:#CDD2D9; --bush:#5C9E5F;
  --shd:rgba(30,50,20,.18); --badge-ink:#FFFFFF; --ring:#FFFFFF;
  --skin:#F0C193; --hat:#8A5A34; --pants:#33415C;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1522;--surface:#18202F;--surface2:#222C3E;--ink:#E6EBF3;--muted:#98A4BA;
  --line:#2F3A50;--accent:#7FA2F5;--accent-ink:#0F1522;--ok:#5CCB8E;--ok-bg:#16301F;--bad:#F08A80;--bad-bg:#3A1C1A;--amber:#E9B45C;--amber-bg:#3A2C12;--myst:#B69BF0;--myst-bg:#2A2040;
  --grass:#1F3326;--grass2:#2A4533;--dirt:#5E4D34;--dirt-hi:#766246;--dirt-edge:#463925;
  --tree:#2F6B40;--tree2:#3F8753;--pine:#28573A;--trunk:#5A3E26;--rock:#5B6470;--rock2:#7A8491;--bush:#2F6E3E;
  --shd:rgba(0,0,0,.3);--badge-ink:#0F1522;--ring:#18202F;--skin:#E2AE80;--hat:#A8744A;--pants:#46557A;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1522;--surface:#18202F;--surface2:#222C3E;--ink:#E6EBF3;--muted:#98A4BA;
  --line:#2F3A50;--accent:#7FA2F5;--accent-ink:#0F1522;--ok:#5CCB8E;--ok-bg:#16301F;--bad:#F08A80;--bad-bg:#3A1C1A;--amber:#E9B45C;--amber-bg:#3A2C12;--myst:#B69BF0;--myst-bg:#2A2040;
  --grass:#1F3326;--grass2:#2A4533;--dirt:#5E4D34;--dirt-hi:#766246;--dirt-edge:#463925;
  --tree:#2F6B40;--tree2:#3F8753;--pine:#28573A;--trunk:#5A3E26;--rock:#5B6470;--rock2:#7A8491;--bush:#2F6E3E;
  --shd:rgba(0,0,0,.3);--badge-ink:#0F1522;--ring:#18202F;--skin:#E2AE80;--hat:#A8744A;--pants:#46557A;}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:24px 60px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,50px);line-height:1;margin:0;letter-spacing:-.02em}
.brand h1 .code{font-family:var(--mono);font-weight:700;color:var(--ok);font-size:.78em;letter-spacing:-.04em}
.brand p{margin:6px 0 0;color:var(--muted)}
.stats{display:flex;gap:8px;font-family:var(--mono);font-size:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}
.stat b{color:var(--accent)}
nav.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface2);padding:5px;border-radius:12px}
nav.modes button{font:600 15px var(--body);border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:8px;cursor:pointer}
nav.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.15)}
nav.modes button small{display:block;font:500 11px var(--mono);opacity:.8}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- trail ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.hud b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;list-style:none;margin:0;padding:0}
.dots li{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;background:var(--surface)}
.dots li.now{border:2px solid var(--accent)}
.dots li.ok{border:2px solid var(--ok);background:var(--ok-bg)}
.dots li.no{border:2px solid var(--bad);background:var(--bad-bg)}
.dots li svg{width:14px;height:14px}
.scene-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--grass)}
#scene{display:block;width:100%;height:auto;aspect-ratio:800/500;touch-action:manipulation}
.prompt{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:600 14px var(--body);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.prompt kbd{margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ico-dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c)}
.ico-dot svg{width:15px;height:15px;fill:var(--badge-ink)}
.easy{--c:var(--ok)} .medium{--c:var(--amber)} .hard{--c:var(--bad)} .mystery{--c:var(--myst)}
.dots li svg{fill:var(--c)}

/* svg world */
.grassbg{fill:var(--grass)} .grassmark{stroke:var(--grass2);stroke-width:2.5;stroke-linecap:round;fill:none}
.edge{fill:none;stroke:var(--dirt-edge);stroke-width:56;stroke-linecap:round}
.dirt{fill:none;stroke:var(--dirt);stroke-width:44;stroke-linecap:round;transition:stroke .2s}
.hit{fill:none;stroke:transparent;stroke-width:96;pointer-events:stroke;cursor:pointer}
.branch.hover .dirt{stroke:var(--dirt-hi)}
.branch,.sign{transition:opacity .5s}
.branch.dim,.sign.dim{opacity:.3;pointer-events:none}
.fresh{animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}}
.sign{cursor:pointer}
.sign .badge{fill:var(--c);stroke:var(--ring);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:transform .2s}
.sign.hover .badge,.sign:hover .badge{transform:scale(1.12)}
.sign .ico{fill:var(--badge-ink);pointer-events:none}
.sign .post{fill:var(--trunk)}
.slabel{font:700 12px var(--mono);fill:var(--ink);stroke:var(--grass);stroke-width:5;paint-order:stroke;letter-spacing:.06em;pointer-events:none}
.sign.mystery .badge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.sign.reveal .badge{animation:reveal .7s ease-out}
@keyframes reveal{0%{transform:scale(.4) rotate(-180deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.shd{fill:var(--shd)} .trunk{fill:var(--trunk)} .tree{fill:var(--tree)} .tree2{fill:var(--tree2)} .pine{fill:var(--pine)}
.bush{fill:var(--bush)} .rock{fill:var(--rock)} .rock2{fill:var(--rock2)} .tuft{stroke:var(--tree);stroke-width:2.5;stroke-linecap:round;fill:none}
.f1{fill:#E86A8A} .f2{fill:#F2C14E} .f3{fill:#FFFFFF} .fc{fill:#F2C14E}
.h-leg{fill:var(--pants)} .h-pack{fill:var(--amber)} .h-shirt{fill:var(--accent)} .h-skin{fill:var(--skin)} .h-eye{fill:#1b1b1b} .h-hat{fill:var(--hat)} .h-band{fill:var(--bad)}
.float{font:800 22px var(--display);text-anchor:middle;stroke:var(--surface);stroke-width:5;paint-order:stroke}

/* encounter */
.enc{padding:16px}
.enc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){
  .enc{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(2px)}
  .enc-card{width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:rise .35s ease-out}
}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.dpill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--mono);color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.dpill svg{width:16px;height:16px;fill:var(--c)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.bar{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-family:var(--display);font-weight:600;font-size:clamp(19px,3vw,24px);line-height:1.25;margin:0;text-wrap:balance}
.choices{display:grid;gap:8px}
.choice{text-align:left;font:16px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{font:700 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none;margin-top:1px}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.feedback{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px 14px}
.feedback.ok{background:var(--ok-bg)} .feedback.no{background:var(--bad-bg)}
.status{font:700 13px var(--mono);white-space:nowrap;padding-top:2px}
.ok .status{color:var(--ok)} .no .status{color:var(--bad)}
.feedback p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 15px var(--body);border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--ok);color:var(--accent-ink)} .btn.warn{background:var(--amber);color:var(--accent-ink)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-family:var(--mono);font-size:15px;line-height:1.6;background:var(--amber-bg);border-left:4px solid var(--amber);padding:14px 16px;border-radius:0 10px 10px 0}
.tag{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* desert (Deep Dive) */
.scene-wrap.desert{--grass:#EBCF9A;--grass2:#D9B878;--dirt:#D2A56A;--dirt-hi:#E2BC84;--dirt-edge:#B7894F;--shd:rgba(110,70,20,.2);
  --cactus:#5E8C4A;--cactus2:#7CAA62;--redrock:#C0683F;--redrock2:#DA8B5F;--tumble:#9C7B4F;--bone:#F6F0E1;--dry:#B89A5C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scene-wrap.desert{--grass:#3B3226;--grass2:#4A3E2E;--dirt:#5E4B33;--dirt-hi:#72603F;--dirt-edge:#4A3B28;--shd:rgba(0,0,0,.35);
  --cactus:#3E6B40;--cactus2:#4F8250;--redrock:#7C4631;--redrock2:#95593D;--tumble:#7A6243;--bone:#CFC6B2;--dry:#6E5C3C}}
:root[data-theme="dark"] .scene-wrap.desert{--grass:#3B3226;--grass2:#4A3E2E;--dirt:#5E4B33;--dirt-hi:#72603F;--dirt-edge:#4A3B28;--shd:rgba(0,0,0,.35);
  --cactus:#3E6B40;--cactus2:#4F8250;--redrock:#7C4631;--redrock2:#95593D;--tumble:#7A6243;--bone:#CFC6B2;--dry:#6E5C3C}
#heatRect{pointer-events:none} .scene-wrap:not(.desert) #heatRect{display:none}
.sandmark{stroke:var(--grass2);stroke-width:2.5;stroke-linecap:round;fill:none}
.cactus{fill:var(--cactus)} .cactus2{fill:var(--cactus2)} .redrock{fill:var(--redrock)} .redrock2{fill:var(--redrock2)}
.tumble{fill:none;stroke:var(--tumble);stroke-width:2;stroke-linecap:round} .bone{fill:var(--bone)} .dry{stroke:var(--dry);stroke-width:2.5;stroke-linecap:round;fill:none}
.deep{--c:#B8562F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .deep{--c:#E8946B}}
:root[data-theme="dark"] .deep{--c:#E8946B}
.sign .btxt{font:800 12px var(--mono);fill:var(--badge-ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:.02em}
.ctx{font:14px/1.5 var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre}
/* short answer */
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#sa{width:100%;font:16px/1.45 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:84px}
#sa:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
#sa:disabled{opacity:.8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.feedback.half{background:var(--amber-bg)} .half .status{color:var(--amber)}
.feedback.sa>div{display:grid;gap:6px}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:15px}
.keys .hit{color:var(--ok)} .keys .miss{color:var(--muted)}
.model{margin:4px 0 0}
.dots li.half{border:2px solid var(--amber);background:var(--amber-bg)}
.grade{font:700 12px var(--mono);margin-left:6px;white-space:nowrap}
.grade.ok{color:var(--ok)} .grade.half{color:var(--amber)} .grade.no{color:var(--bad)}
.sa-note{flex-basis:100%}
.lvls{display:flex;flex-wrap:wrap;gap:6px}
.lvl{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.lvl b{font-variant-numeric:tabular-nums}
/* summary */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px}
.sum-top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.sum-top h2{font-family:var(--display);font-size:clamp(40px,8vw,64px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.sum-top .status{font-size:15px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.breakdown div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.breakdown b{font-size:18px;font-variant-numeric:tabular-nums}
.path-recap{display:flex;gap:6px;flex-wrap:wrap}
.missed{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.missed>li{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.missed .q2{font-weight:700}
.missed .you{color:var(--bad)} .missed .ans{color:var(--ok)}
.missed .why{color:var(--muted);font-size:15px}

/* practice modes */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);min-height:380px;display:flex;flex-direction:column;gap:16px}
.card{perspective:1200px;cursor:pointer;min-height:240px;border-radius:14px}
.card .inner{position:relative;width:100%;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:10px}
.face.front{background:var(--surface2)}
.face.back{background:var(--surface);transform:rotateY(180deg);border-color:var(--accent)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,34px);line-height:1.15}
.face .def{font-size:18px;max-width:52ch}
.face .hint{font:500 12px var(--mono);color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{font:15px/1.35 var(--body);color:var(--ink);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:52px}
.tile.term{font-weight:700}
.tile.sel{border-color:var(--accent);background:var(--surface2)}
.tile.done{border-color:var(--ok);background:var(--ok-bg);color:var(--muted);cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.summary h2{font-family:var(--display);font-size:32px;margin:0}
.stage .missed li{border-left-width:1px}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}
footer{color:var(--muted);font-size:13px}
@media (max-width:560px){nav.modes{grid-template-columns:repeat(2,1fr)} nav.modes button:last-child{grid-column:1/-1} .match{grid-template-columns:1fr} .prompt{font-size:12px;top:8px} .prompt kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-cactus" viewBox="0 0 24 24"><path d="M10 22V5.5a2 2 0 0 1 4 0V22zM14 13h2a1 1 0 0 0 1-1V8.5a1.5 1.5 0 0 1 3 0V12a4 4 0 0 1-4 4h-2zM10 15H8a4 4 0 0 1-4-4V8.5a1.5 1.5 0 0 1 3 0V11a1 1 0 0 0 1 1h2z"/></symbol>
    <symbol id="i-mystery" viewBox="0 0 24 24"><path d="M12 2.5c-3.6 0-6.2 2.2-6.4 5.5h3.6c.2-1.4 1.2-2.3 2.7-2.3 1.6 0 2.6.9 2.6 2.2 0 1.1-.5 1.7-1.9 2.6-1.8 1.1-2.5 2.3-2.4 4.3v.9h3.5v-.7c0-1.2.4-1.7 1.9-2.6 1.8-1.1 2.8-2.5 2.8-4.6 0-3.3-2.7-5.6-6.4-5.6zM12 17.4a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2z"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div class="brand">

["priv","Which of these is a quasi-identifier?","ZIP code",["Diagnosis","Salary","Full legal name"],"ZIP code alone doesn't identify you but can when combined with age and gender. Diagnosis and salary are sensitive attributes; a full name is a direct identifier.","Understand","Quasi-identifier"],

["priv","A released dataset is 5-anonymous, but everyone in one group shares the same diagnosis. What's still wrong?","An attacker can still learn that diagnosis; the group lacks l-diversity",["Nothing, 5-anonymity fully protects it","The ZIP codes need masking; it lacks masking","It has too many rows; it lacks minimization"],"K-anonymity hides who you are in the group, but if every sensitive value is the same, the value leaks anyway (homogeneity attack). L-diversity fixes that.","Analyze","L-diversity"],

    const minT=Math.min(...pool.map(c=>tcount(c[0])));pool=pool.filter(c=>tcount(c[0])===minT);
    const c=pick(pool);
    let dp=diff==="easy"?CARDS.filter(x=>x[0]!==c[0]):CARDS.filter(x=>x!==c&&x[0]===c[0]);
    if(dp.length<3)dp=CARDS.filter(x=>x!==c);
    const d=shuffle(dp).slice(0,3),why=`${c[1]}: ${c[2]}`;
    q=Math.random()<.5
      ?{t:c[0],bloom:"Remember",pre:"Which term matches?",q:c[2],a:c[1],opts:shuffle([c[1],...d.map(x=>x[1])]),why,unit:c[1]}
      :{t:c[0],bloom:"Remember",pre:"What does this mean?",q:c[1],a:c[2],opts:shuffle([c[2],...d.map(x=>x[2])]),why,unit:c[1]};
  }
  T.units.add(q.unit);T.topics[q.t]=(T.topics[q.t]||0)+1;
  return q;
}

// ---------- short-answer grading (lenient: key ideas, typos OK, any wording) ----------
function normTxt(s){return " "+String(s).toLowerCase().replace(/[‘’`]/g,"'").replace(/[^a-z0-9+'\- ]+/g," ").replace(/\s+/g," ").trim()+" "}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function kwHit(text,toks,kw){
  kw=normTxt(kw).trim();if(!kw)return false;
  if(kw.includes(" "))return text.includes(kw);
  return toks.some(t=>t.startsWith(kw)||(kw.length>=5&&t.length>=kw.length-1&&lev(t.slice(0,kw.length),kw)<=(kw.length>=8?2:1)));
}
function grade(ans,q){
  const text=normTxt(ans),toks=text.trim().split(" ").filter(Boolean);
  const hits=q.groups.map(g=>g.some(k=>kwHit(text,toks,k)));
  const n=hits.filter(Boolean).length;
  const level=n>=q.need?"full":(n>0&&n>=Math.ceil(q.need/2))?"partial":"miss";
  return {hits,level};
}
const CREDIT={full:1,partial:.5,miss:0};
const STATUS={full:["ok","200 OK"],partial:["half","206 Partial Content"],miss:["no","400 Bad Request"]};

function showEnc(E){

    ${E.deep?`<span class="dpill deep">${icon("cactus")}Deep Dive · ${E.pts} pts</span>`:`<span class="dpill ${E.actual}">${icon(E.actual)}${DIFF[E.actual].label}${E.mystery?" · mystery ×2":""} · ${E.pts} pts</span>`}</div>`;
  if(q.sa){

    <p class="q">${esc(q.q)}</p>

    setTimeout(()=>$("#sa")?.focus({preventScroll:innerWidth<700}),60);
  }else{

    <div class="choices">${q.opts.map((o,i)=>`<button class="choice" id="c${i}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;

function nextBtn(){return `<div class="row" style="margin-top:12px"><button class="btn" id="next">${T.step===T.len-1?"See round summary":"Keep walking"}</button></div>`}
function answer(i){
  if(T.answered)return;T.answered=true;
  const E=T.cur,q=E.q,ok=q.opts[i]===q.a,got=ok?E.pts:0;
  T.score+=got;floatText(ok?`+${got}`:"missed",ok?"var(--ok)":"var(--bad)");
  bump(ok);T.log.push({...E,ok,credit:ok?1:0,got,pick:q.opts[i]});renderHud();
  document.querySelectorAll("#encCard .choice").forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><span class="status">${ok?"200 OK":"400 Bad Request"}</span><p>${esc(q.why)}</p></div>${nextBtn()}`;
  $("#next").onclick=next;$("#next").focus({preventScroll:true});
}
function submitSA(skip){
  if(T.answered)return;
  const E=T.cur,q=E.q,ans=skip?"":$("#sa").value.trim();
  if(!skip&&!ans){$("#sa").focus();return}
  T.answered=true;$("#sa").disabled=true;$("#saBtns").hidden=true;
  const g=skip?{hits:q.groups.map(()=>false),level:"miss"}:grade(ans,q);
  const got=Math.round(E.pts*CREDIT[g.level]);
  T.score+=got;floatText(got?`+${got}`:"missed",g.level==="miss"?"var(--bad)":g.level==="partial"?"var(--amber)":"var(--ok)");
  bump(g.level!=="miss");
  const entry={...E,deep:!!E.deep,sa:true,ans,skip,g,level:g.level,credit:CREDIT[g.level],got,ok:g.level==="full",self:false};
  T.log.push(entry);renderHud();renderSAFeedback(entry);
}
function keyList(q,hits,self){
  // groups with many alternatives (like "name two techniques") only list what matters
  return `<ul class="keys">${q.labels.map((l,i)=>`<li class="${hits[i]||self?"hit":"miss"}">${hits[i]?"✓":self?"✓":"–"} ${esc(l)}</li>`).join("")}</ul>`;
}
function renderSAFeedback(e){
  const q=e.q,[cls,code]=STATUS[e.level];

  const msg=e.skip?"No answer given. Here's what I was looking for.":e.level==="full"?(e.self?"Counted as correct (self-graded).":"You hit the key ideas."):e.level==="partial"?"Partly there. Half credit.":"Didn't spot the key ideas.";
  $("#fb").innerHTML=`<div class="feedback sa ${cls}"><span class="status">${code}</span><div><p><b>${msg}</b></p>
    ${need}${keyList(q,e.g.hits,e.self)}<p class="model"><span class="tag">What I was looking for</span><br>${esc(q.model)}</p></div></div>
  ${e.level!=="full"&&!e.skip?`<div class="row"><button class="btn ghost" id="override">My answer covered this. Count it.</button></div>`:""}
  ${nextBtn()}`;
  const ov=$("#override");
  if(ov)ov.onclick=()=>{T.score+=e.pts-e.got;e.got=e.pts;e.level="full";e.credit=1;e.ok=true;e.self=true;
    if(streak===0)bump(true);renderHud();floatText("counted","var(--ok)");renderSAFeedback(e)};

}
function next(){

  <div><div class="tag" style="margin-bottom:6px">Your path</div><ol class="dots path-recap">${T.log.map((l,i)=>`<li class="${STATUS[l.credit===1?"full":l.credit?"partial":"miss"][0]} ${T.deep?"deep":l.actual}" title="Stop ${i+1}">${icon(T.deep?"cactus":l.actual)}</li>`).join("")}</ol></div>
  ${sas.length?`<div class="tag">Short answers · what I was looking for (${sas.length})</div><ul class="missed">${sas.map(l=>{const [cls,c]=STATUS[l.level];return `<li class="${l.deep?"deep":l.actual}">
      ${tag(l)}<span class="q2">${esc(l.q.q)}</span>${l.q.ctx?`<pre class="ctx">${esc(l.q.ctx)}</pre>`:""}
      <span class="yours">Your answer: ${l.skip?"<i>skipped</i>":"“"+esc(l.ans)+"”"} <b class="grade ${cls}">${c}${l.self?" · self-graded":""}</b></span>
      ${keyList(l.q,l.g.hits,l.self)}
      <span class="why"><b>Looking for:</b> ${esc(l.q.model)}</span></li>`}).join("")}</ul>`:""}
  ${missed.length?`<div class="tag">Multiple-choice misses (${missed.length})</div><ul class="missed">${missed.map(l=>`<li class="${l.actual}">

    :(sas.length?"":`<p>Nothing missed. Perfect trail.</p>`)}
  <div class="row"><button class="btn" id="again">Start a new trail</button></div>`;

// ---------- Deep Dive (desert, all short answer) ----------
const TABBR={priv:"PRIV",api:"API",git:"GIT",lic:"LIC",aws:"AWS",data:"SQL",eth:"ETH"};
function deepLeft(){return DEEP.map((d,i)=>({d,i})).filter(o=>inTopic(o.d[0])&&!T.used.has("d"+o.i))}
function deepOptions(){
  const left=deepLeft();
  if(topic==="all"){
    const ts=[...new Set(left.map(o=>o.d[0]))];
    return shuffle(ts).sort((a,b)=>(T.topics[a]||0)-(T.topics[b]||0)).slice(0,3)
      .map(t=>({key:t,kind:"topic",abbr:TABBR[t],label:TOPICS[t].toUpperCase()}));
  }
  const lv=[...new Set(left.map(o=>o.d[1]))].sort((a,b)=>LV.indexOf(a)-LV.indexOf(b));
  return lv.slice(0,3).map(v=>({key:v,kind:"level",abbr:v.slice(0,3).toUpperCase(),label:v.toUpperCase()}));
}
function buildDeep(opt){
  let pool=deepLeft().filter(o=>opt.kind==="topic"?o.d[0]===opt.key:o.d[1]===opt.key);
  if(!pool.length)pool=deepLeft();
  const target=2+Math.round(T.step*3/Math.max(1,T.len-1));
  const best=Math.min(...pool.map(o=>Math.abs(LV.indexOf(o.d[1])-target)));
  const o=pick(pool.filter(x=>Math.abs(LV.indexOf(x.d[1])-target)===best)),s=o.d;
  T.used.add("d"+o.i);T.topics[s[0]]=(T.topics[s[0]]||0)+1;
  return {sa:true,deep:true,t:s[0],bloom:s[1],q:s[2],ctx:s[3],groups:s[4],need:s[5],a:s[6],model:s[6],labels:s[7],unit:"d"+o.i};
}
function setLegend(){
  if(T.deep){

    <span class="sa-note">Signs show the ${topic==="all"?"topic":"thinking level"} waiting down each path. Questions get harder (Apply → Create) the deeper you go.</span>`;
    return;
  }
  $("#legend").innerHTML=[["easy","Easy · 100 pts · recall (Remember)"],["medium","Medium · 200 pts · explain & classify (Understand)"],["hard","Hard · 300 pts · Apply → Analyze → Evaluate → Create, climbing as the round goes on"],["mystery","Mystery · random difficulty, double points"],["sa","✎ Some Medium and Hard stops are short answer: graded on key ideas, half credit for partial answers"]]
    .map(([d,t])=>d==="sa"?`<span class="sa-note">${t}</span>`:`<span><span class="ico-dot ${d}">${icon(d)}</span>${t}</span>`).join("");
}

// ---------- match ----------

function matchStart(){
  clearInterval(M.timer);
  const set=shuffle(CARDS.filter(c=>inTopic(c[0]))).slice(0,6);
  M={set,terms:shuffle(set),defs:shuffle(set),sel:null,done:0,miss:0,t0:Date.now(),timer:null};
  const bestKey="s200-match-"+topic;
  $("#stage").innerHTML=`<div class="meta"><span>Match each term to its meaning</span><span><span id="clock">0.0</span>s · misses <span id="miss">0</span> · best ${store.get(bestKey,null)?store.get(bestKey)+"s":"—"}</span></div>
  <div class="match"><div class="col" id="terms"></div><div class="col" id="defs"></div></div>`;
  M.terms.forEach((c,i)=>{const b=document.createElement("button");b.className="tile term";b.id="mt"+i;b.textContent=c[1];b.onclick=()=>{if(b.classList.contains("done"))return;document.querySelectorAll(".tile.term").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");M.sel={c,b}};$("#terms").appendChild(b)});
  M.defs.forEach((c,i)=>{const b=document.createElement("button");b.className="tile";b.id="md"+i;b.textContent=c[2];b.onclick=()=>matchPick(c,b);$("#defs").appendChild(b)});

}
function matchPick(c,b){

    if(M.done===M.set.length){clearInterval(M.timer);const t=+((Date.now()-M.t0)/1000).toFixed(1),k="s200-match-"+topic,prev=store.get(k,null),rec=prev==null||t<prev;if(rec)store.set(k,t);
      const s=$("#stage");const d=document.createElement("div");d.className="feedback ok";d.innerHTML=`<span class="status">200 OK</span><p>All matched in ${t}s with ${M.miss} miss${M.miss===1?"":"es"}.${rec?" New best time.":""}</p>`;s.appendChild(d);
      const r=document.createElement("div");r.className="row";r.innerHTML=`<button class="btn" id="again">Play again</button>`;s.appendChild(r);$("#again").onclick=matchStart;$("#again").focus();}

// ---------- boot ----------
function start(){
  clearInterval(M.timer);cancelAnimationFrame(T.raf);
  const trail=mode==="trail"||mode==="deep";$("#trail").hidden=!trail;$("#stage").hidden=trail;
  ({trail:()=>trailStart(false),deep:()=>trailStart(true),cards:cardsStart,match:matchStart,spot:spotStart})[mode]();
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(mode==="trail"||mode==="deep"){
    const encOpen=!$("#enc").hidden;
    if(!encOpen&&!T.busy&&$("#summary").hidden&&T.branches.length){
      const B=T.branches,map={ArrowLeft:B[0],ArrowRight:B[B.length-1],ArrowUp:B.length===3?B[1]:B.length===1?B[0]:null,"1":B[0],"2":B[1],"3":B[2]};
      if(map[e.key]){e.preventDefault();choose(map[e.key])}
      return;
    }
    if(encOpen&&/^[1-4]$/.test(e.key)){const b=$("#encCard #c"+(+e.key-1));if(b&&!b.disabled)b.click()}
    return;
  }
  if(mode==="cards"&&e.key===" "&&$("#card")){e.preventDefault();$("#card").classList.toggle("flip");return}
  if(mode==="spot"&&/^[1-2]$/.test(e.key)){const b=$("#stage #c"+(+e.key-1));if(b&&!b.disabled)b.click()}
});
function fitView(){const narrow=innerWidth<600,sc=$("#scene");sc.setAttribute("viewBox",narrow?"130 40 540 460":"0 0 800 500");sc.style.aspectRatio=narrow?"540/460":"800/500"}
addEventListener("resize",fitView);fitView();
renderTopics();start();
</script>
